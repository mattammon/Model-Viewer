services:
  ingest:
    build: .
    command: ["--config", "config/starter.json", "watch"]
    restart: unless-stopped
    volumes:
      - model-data:/data
  catalog:
    build: .
    command: ["--config", "config/starter.json", "serve", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - model-data:/data
volumes:
  model-data:
